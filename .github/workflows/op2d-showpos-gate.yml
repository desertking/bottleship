name: One-off USER32 ShowWindow full gate
on:
  push:
    branches: [fix/user32-showpos-gate-20261118]
    paths: ['.github/workflows/op2d-showpos-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NAGA_VERSION: '30.0.1'
      CARGO_BUILD_JOBS: '1'
      NODE_OPTIONS: --max-old-space-size=2048
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          path: driver
      - uses: actions/checkout@v7
        with:
          ref: 0df5795410edf451c83724309ed411bdb60c0c75
          path: source
          submodules: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: actions/cache@v6
        id: naga
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-${{ env.NAGA_VERSION }}-${{ runner.os }}
      - name: Guarded dependencies
        working-directory: source
        run: |
          mkdir -p "$HOME/tools"
          flock "$HOME/tools/schwer.lock" nice -n 19 python3 ../driver/tools/op2d-ci-guard.py bun install --frozen-lockfile
      - name: Guarded validator build
        if: steps.naga.outputs.cache-hit != 'true'
        working-directory: source
        run: flock "$HOME/tools/schwer.lock" nice -n 19 python3 ../driver/tools/op2d-ci-guard.py cargo install naga-cli --locked --version "$NAGA_VERSION"
      - name: Exact product gate
        working-directory: source
        run: |
          set -o pipefail
          git rev-parse HEAD > ../product-head.txt
          flock "$HOME/tools/schwer.lock" nice -n 19 python3 ../driver/tools/op2d-ci-guard.py bun run gate 2>&1 | tee ../showpos-full-gate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showpos-full-gate-0df57954
          path: |
            showpos-full-gate.log
            product-head.txt
          if-no-files-found: warn
          retention-days: 3
